name: Generate OIO Photo Captions

on:
  # Run daily after the morning ingestion
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      photo_id:
        description: 'Single photo UUID (optional — leave blank to process all eligible)'
        required: false
      dry_run:
        description: 'Print captions without saving (true/false)'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate captions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.photo_id }}" ]; then
            ARGS="--photo-id ${{ github.event.inputs.photo_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/generate_captions.py $ARGS
