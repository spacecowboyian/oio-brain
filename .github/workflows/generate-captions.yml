name: Generate OIO Photo Captions

# DEPRECATED: superseded by process-photos.yml (US-001, 2026-04-06)
# Kept for reference only — all active scheduling removed.
on:
  workflow_dispatch:
    inputs:
      google_id:
        description: 'Google Photos ID of a single photo (optional — leave blank to process all eligible)'
        required: false
      dry_run:
        description: 'Print captions without saving (true/false)'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated photo-log.md files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate captions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.google_id }}" ]; then
            ARGS="--google-id ${{ github.event.inputs.google_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python dev/scripts/generate_captions.py $ARGS

      - name: Commit updated photo logs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/
          if git diff --cached --quiet; then
            echo "No caption changes to commit."
          else
            git commit -m "chore: add generated captions to photo logs [skip ci]"
            git push
            echo "Photo logs updated and pushed."
          fi
