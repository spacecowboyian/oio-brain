name: File Picdump Photos with AI

on:
  # When process-intake/photos-photos detects new images and manually triggers this
  workflow_call:
    inputs:
      image_count:
        required: false
        type: string
        default: '0'

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  file-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI photo filing agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python scripts/ai_photo_filing_agent.py

      - name: Commit filed photos
        run: |
          git config user.name "OIO Photo Filing Bot"
          git config user.email "bot@oioracing.local"

          # Add any new filed photos and updated index
          git add photos/ photos/README.md "cars/" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new photos to commit."
          else
            git commit -m "chore: file intake/photos photos with AI

Auto-filed and organized photos from intake/photos into photo library.
Updated photos/README.md and car descriptions.

Co-Authored-By: Paperclip <noreply@paperclip.ing>" || true
            git push
          fi

      - name: Handle uncertain photos
        if: failure()
        run: |
          echo "Some photos could not be auto-filed and require manual review."
          echo "Check Slack notifications or intake/photos folder for images."
