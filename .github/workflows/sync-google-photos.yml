name: Sync Google Photos Album to Picdump

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger with optional inputs
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if photos already downloaded'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Sync photos from Google Photos album
        run: |
          python3 scripts/sync_google_photos.py
        env:
          GOOGLE_PHOTOS_ALBUM_URL: ${{ secrets.GOOGLE_PHOTOS_ALBUM_URL }}

      - name: Commit new photos
        run: |
          git config user.name "OIO Photo Sync Bot"
          git config user.email "bot@oioracing.local"

          # Check if there are new photos to commit
          if [ -z "$(git status --porcelain picdump/)" ]; then
            echo "No new photos to commit."
          else
            echo "Found new photos in picdump/"
            git add picdump/ .github/sync-state/ 2>/dev/null || true

            # Count new photos
            NEW_COUNT=$(git diff --cached --name-only picdump/ | grep -E '\.(jpg|jpeg|png|heic|webp)$' | wc -l)

            if [ "$NEW_COUNT" -gt 0 ]; then
              git commit -m "chore: sync $NEW_COUNT photo(s) from Google Photos album

Auto-downloaded new photos from the shared Google Photos album.
Photos are staged in picdump/ for AI filing workflow.

Co-Authored-By: Paperclip <noreply@paperclip.ing>" || true
              git push
              echo "✓ Committed $NEW_COUNT new photos"
            fi
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Photo sync failed. Check workflow logs for details."
