name: Create OIO PostBridge Drafts

on:
  # Run daily after caption generation
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      google_id:
        description: 'Google Photos ID of a single photo (optional — leave blank to process all eligible)'
        required: false
      dry_run:
        description: 'Print draft info without creating (true/false)'
        required: false
        default: 'false'

jobs:
  create-drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated photo-log.md files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create PostBridge drafts
        env:
          POSTBRIDGE_API_KEY: ${{ secrets.POSTBRIDGE_API_KEY }}
          POSTBRIDGE_ACCOUNT_IDS: ${{ secrets.POSTBRIDGE_ACCOUNT_IDS }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.google_id }}" ]; then
            ARGS="--google-id ${{ github.event.inputs.google_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python dev/scripts/create_postbridge_drafts.py $ARGS

      - name: Commit updated photo logs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/
          if git diff --cached --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "chore: log PostBridge draft IDs in photo logs [skip ci]"
            git push
            echo "Photo logs updated and pushed."
          fi
