name: Fetch YouTube Transcripts

on:
  # Run on a schedule to automatically process transcripts in batches.
  # Each run fetches --batch-size new videos. Runs every 2 hours until all
  # transcripts are up to date, then becomes a no-op.
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours

  workflow_dispatch:
    inputs:
      fetch_all:
        description: 'Re-fetch ALL transcripts (ignores already-processed). Default: only new ones.'
        required: false
        default: 'false'
        type: boolean
      batch_size:
        description: 'Max videos to fetch in this run (0 = no limit). Default: 25.'
        required: false
        default: '25'
        type: string

  push:
    branches:
      - main
    paths:
      - 'OIO-Video-Catalog.md'

jobs:
  fetch-transcripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch transcripts
        run: |
          BATCH_SIZE="${{ github.event.inputs.batch_size }}"
          BATCH_SIZE="${BATCH_SIZE:-25}"

          if [ "${{ github.event.inputs.fetch_all }}" = "true" ]; then
            python scripts/fetch_transcripts.py --all --batch-size "$BATCH_SIZE"
          else
            python scripts/fetch_transcripts.py --batch-size "$BATCH_SIZE"
          fi

      - name: Generate clean scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/clean_transcripts.py

      - name: Update catalog with transcript links
        run: python scripts/update_catalog_transcripts.py

      - name: Commit transcripts and catalog updates
        run: |
          git config user.name "OIO Transcript Bot"
          git config user.email "bot@oioracing.local"
          git add "OIO Brain/02 - Content/Video Scripts/" OIO-Video-Catalog.md
          if git diff --cached --quiet; then
            echo "No new transcripts or catalog updates to commit."
          else
            NEW_COUNT=$(git diff --cached --name-only | grep 'transcript.md' | wc -l)
            git commit -m "chore: add ${NEW_COUNT} transcript(s) and clean scripts, update catalog [skip ci]"
            git push
          fi
