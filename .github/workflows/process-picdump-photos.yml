name: Process Picdump Photos

on:
  push:
    branches:
      - main
    paths:
      - 'intake/photos/**'
  workflow_dispatch:

jobs:
  process-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new image files in intake/photos
        id: detect
        run: |
          # For manual dispatch, list all current images; for push, find newly added files
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGES=$(find intake/photos/ -maxdepth 1 -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' -o -iname '*.webp' \) \
              2>/dev/null || true)
          else
            # Find image files added in this push
            IMAGES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'intake/photos/*.png' 'intake/photos/*.jpg' 'intake/photos/*.jpeg' 'intake/photos/*.heic' 'intake/photos/*.webp' 2>/dev/null || true)
          fi

          if [ -z "$IMAGES" ]; then
            echo "No new image files detected in intake/photos."
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$IMAGES" | wc -l | tr -d ' ')
            echo "Detected $COUNT new image(s) in intake/photos:"
            echo "$IMAGES"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            echo "image_count=$COUNT" >> "$GITHUB_OUTPUT"

            # Build a markdown list of filenames for the issue body
            FILE_LIST=$(echo "$IMAGES" | sed 's/^/- /')
            # Use EOF delimiter to handle multi-line safely
            {
              echo "file_list<<PICDUMP_EOF"
              echo "$FILE_LIST"
              echo "PICDUMP_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure copilot label exists
        if: steps.detect.outputs.has_images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "copilot" \
            --description "Assign to GitHub Copilot agent" \
            --color "6e40c9" \
            --force

      - name: Spawn Copilot agent to process photos
        if: steps.detect.outputs.has_images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.detect.outputs.image_count }}"
          FILE_LIST="${{ steps.detect.outputs.file_list }}"

          gh issue create \
            --title "Process ${COUNT} new photo(s) from intake/photos" \
            --body "@copilot New photo(s) have been pushed to \`picdump/\` and need to be processed into the OIO photo library.

          **Files to process:**
          ${FILE_LIST}

          **Instructions — follow these steps exactly:**

          1. **View each image** in \`picdump/\` to see what car is in it
          2. **Identify the car** using:
             - Visual cues in the photo (color, body shape, wheels, livery, decals, era)
             - Cross-reference against the OIO fleet in \`cars/\`
             - Use the \`PHOTO-INDEX.md\` Visual ID markers sections as a reference
             - Apply general automotive knowledge if needed (make/model recognition from shape, era, details)
          3. **File the photo** by moving it to \`photos/{Driver}/{Car}/\` — create the folder if it doesn't exist
          4. **Create or update** the per-car \`photo-log.md\` in that folder with full details:
             - Filename, estimated date, event/context, subject description, social media status
             - Detailed visual description of what is visible in the shot
          5. **Update \`PHOTO-INDEX.md\`** at the repo root:
             - Add the photo to the correct driver/car section
             - Update the Quick Stats totals
          6. **Update the car's \`Overview.md\`** in \`cars/\`:
             - Add or update the Visual Identification section with any new details seen in the photo
             - Add the photo to the Photo Library table
             - If no Visual Identification section exists, create one using the format in \`Ian/1985 MR2/Overview.md\` as a template
          7. **Delete the original file(s)** from \`picdump/\` after all data has been written
          8. **Update \`01-active/\`** files if any state changes are relevant

          If a photo cannot be confidently identified, add it to \`active/open-loops.md\` with a note and still remove it from intake/photos (move to \`photos/unidentified/\`).

          Follow all repo standards: frontmatter on new files, update \`updated:\` dates, log significant decisions in \`core/decisions-log.md\`." \
            --label "copilot" \
            --assignee "Copilot"
