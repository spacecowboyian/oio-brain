name: Process Picdump Photos

on:
  push:
    branches:
      - main
    paths:
      - 'picdump/**'
  workflow_dispatch:

jobs:
  process-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests

      - name: Detect new image files in picdump
        id: detect
        run: |
          # For manual dispatch, list all current images; for push, find newly added files
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGES=$(find picdump/ -maxdepth 1 -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' -o -iname '*.webp' \) \
              2>/dev/null || true)
          else
            # Find image files added in this push
            IMAGES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'picdump/*.png' 'picdump/*.jpg' 'picdump/*.jpeg' 'picdump/*.heic' 'picdump/*.webp' 2>/dev/null || true)
          fi

          if [ -z "$IMAGES" ]; then
            echo "No new image files detected in picdump."
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$IMAGES" | wc -l | tr -d ' ')
            echo "Detected $COUNT new image(s) in picdump:"
            echo "$IMAGES"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            echo "image_count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI photo filing agent
        if: steps.detect.outputs.has_images == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/ai_photo_filing_agent.py

      - name: Commit filed photos and updates
        if: steps.detect.outputs.has_images == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all changes (filed photos, updated docs, metadata)
          git add photos/ PHOTO-INDEX.md "OIO Brain/03 - Cars/" .photo-filing-results.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Read results summary for commit message
            FILED_COUNT=$(python -c "import json; data=json.load(open('.photo-filing-results.json')); print(len([r for r in data if r['status']=='filed']))")
            FLAGGED_COUNT=$(python -c "import json; data=json.load(open('.photo-filing-results.json')); print(len([r for r in data if r['status']=='flagged']))")

            git commit -m "$(cat <<'EOF'
          chore: AI photo filing - processed ${{ steps.detect.outputs.image_count }} photo(s)

          - Filed: ${FILED_COUNT}
          - Flagged for review: ${FLAGGED_COUNT}

          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          Co-Authored-By: Paperclip <noreply@paperclip.ing>
          EOF
          )"
            git push
          fi
