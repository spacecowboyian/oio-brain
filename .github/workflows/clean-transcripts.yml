name: Clean Transcripts

on:
  # Manual trigger - allows board to run it anytime
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-clean all transcripts (including already cleaned)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  clean-transcripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean transcripts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            python scripts/clean_transcripts.py --all
          else
            python scripts/clean_transcripts.py
          fi

      - name: Commit generated clean scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "OIO Brain/02 - Content/Video Scripts/*/clean-script.md"
          if git diff --cached --quiet; then
            echo "No new clean scripts to commit."
          else
            SCRIPT_COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "chore: generate ${SCRIPT_COUNT} clean transcript script(s) [skip ci]"
            git push
            echo "✓ Committed and pushed ${SCRIPT_COUNT} clean script(s)"
          fi
