name: Process OIO Photos (Unified Pipeline)

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:

jobs:
  process-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated photo-log.md files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic google-auth google-auth-httplib2

      - name: Run photo pipeline
        env:
          GOOGLE_PHOTOS_CREDENTIALS: ${{ secrets.GOOGLE_PHOTOS_CREDENTIALS }}
          GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.GOOGLE_PHOTOS_ALBUM_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTBRIDGE_API_KEY: ${{ secrets.POSTBRIDGE_API_KEY }}
          POSTBRIDGE_ACCOUNT_IDS: ${{ secrets.POSTBRIDGE_ACCOUNT_IDS }}
        run: python dev/scripts/process_photos.py

      - name: Commit updated photo logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/
          if git diff --cached --quiet; then
            echo "No photo log changes to commit."
          else
            git commit -m "chore: update photo logs from pipeline run [skip ci]"
            git push
            echo "Photo logs updated and pushed."
          fi
