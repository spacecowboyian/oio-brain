name: Fetch OIO YouTube Videos

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  fetch-videos:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch OIO YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/oio-video-fetcher.js

      - name: Commit updated master + delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "OIO Brain/02 - Content/oio-videos-master.json"
          # Only stage the docdump delta if the script wrote one (new videos found)
          if [ -f docdump/oio_videos_raw.json ]; then
            git add docdump/oio_videos_raw.json
            git diff --cached --quiet || git commit -m "chore: update video master + queue new videos for agent [skip ci]"
          else
            git diff --cached --quiet || git commit -m "chore: refresh video stats in master [skip ci]"
          fi
          git push
