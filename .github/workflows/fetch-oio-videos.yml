name: Fetch OIO YouTube Videos

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  fetch-videos:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch OIO YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/oio-video-fetcher.js

      - name: Commit updated master + delta
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/oio-videos-master.json"
          # Only stage the intake/docs delta if the script wrote one (new videos found)
          if [ -f intake/docs/oio_videos_raw.json ]; then
            git add intake/docs/oio_videos_raw.json
            git diff --cached --quiet || git commit -m "chore: update video master + queue new videos for agent [skip ci]"
            git push
            echo "has_new_videos=true" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --quiet || git commit -m "chore: refresh video stats in master [skip ci]"
            git push
            echo "has_new_videos=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Spawn Copilot agent to process new videos
        if: steps.commit.outputs.has_new_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_COUNT=$(node -e "const f=require('./intake/docs/oio_videos_raw.json'); console.log(f.length);")
          gh issue create \
            --title "Process ${NEW_COUNT} new OIO video(s) from intake/docs" \
            --body "@copilot New video data has been written to \`docdump/oio_videos_raw.json\` (${NEW_COUNT} video(s)).

          Please follow the intake/docs workflow:
          1. Read \`docdump/oio_videos_raw.json\`
          2. Distribute the data to the appropriate brain files (e.g. \`OIO Brain/02 - Content/Published-Videos.md\`, \`OIO Brain/02 - Content/Video-Ideas-Backlog.md\`, etc.)
          3. Update \`01-active/\` files as needed to reflect any state changes
          4. Delete \`docdump/oio_videos_raw.json\` once all data has been written" \
            --label "copilot" \
            --assignee "Copilot"
